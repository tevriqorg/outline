name: QQ network probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qq-network-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve QQ flash file with browser and measure
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > /tmp/probe.js <<'JS'
          const { chromium } = require('playwright');
          const { performance } = require('perf_hooks');
          const crypto = require('crypto');
          (async()=>{
            const share='https://qfile.qq.com/q/XVVRRj34Qs';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true});
            const seen=[];
            page.on('response', async r=>{
              const u=r.url();
              if(/qfile|multimedia|download|fileset/i.test(u)) {
                const h=await r.allHeaders().catch(()=>({}));
                console.log('NET',r.status(),h['content-length']||'',h['content-type']||'',u.slice(0,900));
                seen.push(u);
              }
            });
            await page.goto(share,{waitUntil:'networkidle',timeout:60000});
            console.log('TITLE',await page.title());
            console.log('BODY',(await page.locator('body').innerText()).slice(0,4000));
            const buttons=page.getByText(/下载|保存|QQ\.apk/i);
            console.log('MATCHES',await buttons.count());
            let download;
            for(let i=0;i<await buttons.count();i++){
              const el=buttons.nth(i);
              if(!(await el.isVisible().catch(()=>false))) continue;
              console.log('CLICK',i,await el.innerText().catch(()=>''));
              try {
                const ev=page.waitForEvent('download',{timeout:15000});
                await el.click({timeout:5000});
                download=await ev; break;
              } catch(e) { console.log('click_no_download',String(e).slice(0,300)); }
            }
            if(!download){
              const links=await page.locator('a').evaluateAll(as=>as.map(a=>({t:a.innerText,href:a.href})).filter(x=>/download|multimedia\.qfile/i.test(x.href)||/下载|QQ\.apk/i.test(x.t)));
              console.log('LINKS',JSON.stringify(links).slice(0,8000));
              throw new Error('NO_BROWSER_DOWNLOAD');
            }
            console.log('SUGGESTED',download.suggestedFilename());
            const t0=performance.now();
            const path=await download.path();
            const t1=performance.now();
            const fs=require('fs'); const st=fs.statSync(path);
            const sha=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            const sec=(t1-t0)/1000;
            console.log('RESULT bytes='+st.size+' MiB='+(st.size/1048576).toFixed(2)+' seconds='+sec.toFixed(3)+' MBps='+(st.size/sec/1e6).toFixed(3)+' Mbps='+(st.size/sec*8/1e6).toFixed(3)+' sha256='+sha);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/probe.js
